[project]
name = "parlant-agent-server"
version = "0.1.0"
description = "BFF / metadata service for the Parlant agent platform: agent definition CRUD + publish orchestration (sole writer of the definition layer), session proxy + SSE passthrough to parlant-agent-runtime; the only backend facing parlant-agent-web"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",         # runtime client（boundary 层，异步 + SSE 透传）
    "motor>=3.5",          # MongoDB async driver（定义层 agent_definitions，本服务独占写）
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.3.2",
    "PyJWT>=2.8",          # AUTH_MODE=gateway：RS256 验签 + PyJWKClient 拉 IAM JWKS（doc09 §4.1）
    "cryptography>=42",    # PyJWT RS256 验签（AUTH_MODE=gateway，JWKS 公钥，E2E-1）
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# B008 豁免 FastAPI 依赖注入惯用法 `ctx: AuthorizationContext = Depends(require("agent:publish"))`：
# `require(...)` 在**导入期**求值一次返回依赖工厂（非每请求调用），是安全不可变调用；
# 这是同步 doc09 §4.2 / doc10 §4 的显式写法，逐处加 noqa 反而噪音。仅豁免路由层，不弱化其它检查。
"app/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
